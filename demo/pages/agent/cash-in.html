<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cash in | MoMo</title><link rel="stylesheet" href="/portal.css"></head>
<body data-required-role="agent" data-page="cash-in" data-title="Cash in">
  <div class="portal-layout"><aside class="portal-sidebar"><a class="brand" href="/"><span class="brand-mark">M</span><span>MoMo Platform</span></a><nav id="portalNav" aria-label="Agent navigation"></nav><button class="button secondary signout" id="signout" type="button">Sign out</button></aside>
    <div class="portal-main"><header class="app-header"><h1 id="pageTitle">Cash in</h1><div><span id="portalName"></span> · <span id="portalRole"></span></div></header><main class="page-content"><h2>Credit a customer wallet</h2><p>Cash-in is submitted from your own agent float wallet. The server validates your agent authorization and wallet ownership.</p><div id="pageNotice" class="page-notice" role="status" aria-live="polite" hidden></div><section class="panel form-panel"><form data-transaction-type="CASH_IN" data-endpoint="/agents/cash-in" data-operation-label="Agent cash-in">
      <div class="field"><label for="fromWallet">Your agent float wallet ID</label><input id="fromWallet" name="from_wallet" required autocomplete="off"></div><div class="field"><label for="toWallet">Customer wallet ID</label><input id="toWallet" name="to_wallet" required autocomplete="off"></div><div class="field"><label for="amount">Amount</label><input id="amount" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required></div><div class="field"><label for="currency">Currency</label><select id="currency" name="currency"><option value="ZMW">ZMW ? Zambian Kwacha</option><option value="USD">USD ? US Dollar</option></select></div><button class="button" type="submit">Review and process cash-in</button>
    </form></section></main></div></div><script src="/portal.js"></script>
</body></html>

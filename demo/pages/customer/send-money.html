<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Send money | MoMo</title><link rel="stylesheet" href="/portal.css"></head>
<body data-required-role="customer" data-page="send-money" data-title="Send money">
  <div class="portal-layout"><aside class="portal-sidebar"><a class="brand" href="/"><span class="brand-mark">M</span><span>MoMo Platform</span></a><nav id="portalNav" aria-label="Customer navigation"></nav><button class="button secondary signout" id="signout" type="button">Sign out</button></aside>
    <div class="portal-main"><header class="app-header"><h1 id="pageTitle">Send money</h1><div><span id="portalName"></span> · <span id="portalRole"></span></div></header><main class="page-content"><h2>Transfer to a wallet</h2><p>Check recipient and amount carefully. The API validates wallet ownership and authoritative balances.</p><div id="pageNotice" class="page-notice" role="status" aria-live="polite" hidden></div>
      <section class="panel form-panel"><form data-transaction-type="TRANSFER" data-endpoint="/transfers" data-operation-label="Money transfer">
        <div class="field"><label for="fromWallet">Your source wallet ID</label><input id="fromWallet" name="from_wallet" required autocomplete="off"></div>
        <div class="field"><label for="toWallet">Recipient wallet ID</label><input id="toWallet" name="to_wallet" required autocomplete="off"></div>
        <div class="field"><label for="amount">Amount</label><input id="amount" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required></div><div class="field"><label for="currency">Currency</label><select id="currency" name="currency"><option value="ZMW">ZMW ? Zambian Kwacha</option><option value="USD">USD ? US Dollar</option></select></div>
        <button class="button" type="submit">Review and send</button>
      </form></section>
    </main></div></div><script src="/portal.js"></script>
</body></html>

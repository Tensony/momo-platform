<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cash out | MoMo</title><link rel="stylesheet" href="/portal.css"></head>
<body data-required-role="customer" data-page="cash-out" data-title="Cash out">
  <div class="portal-layout"><aside class="portal-sidebar"><a class="brand" href="/"><span class="brand-mark">M</span><span>MoMo Platform</span></a><nav id="portalNav" aria-label="Customer navigation"></nav><button class="button secondary signout" id="signout" type="button">Sign out</button></aside>
    <div class="portal-main"><header class="app-header"><h1 id="pageTitle">Cash out</h1><div><span id="portalName"></span> · <span id="portalRole"></span></div></header><main class="page-content"><h2>Request cash-out through an agent</h2><p>The customer-owned wallet is debited by the backend flow. The agent wallet must be an eligible destination.</p><div id="pageNotice" class="page-notice" role="status" aria-live="polite" hidden></div><section class="panel form-panel"><form data-transaction-type="CASH_OUT" data-endpoint="/agents/cash-out" data-operation-label="Customer cash-out">
      <div class="field"><label for="fromWallet">Your customer wallet ID</label><input id="fromWallet" name="from_wallet" required autocomplete="off"></div><div class="field"><label for="toWallet">Agent wallet ID</label><input id="toWallet" name="to_wallet" required autocomplete="off"></div><div class="field"><label for="amount">Amount</label><input id="amount" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required></div><div class="field"><label for="currency">Currency</label><select id="currency" name="currency"><option value="ZMW">ZMW ? Zambian Kwacha</option><option value="USD">USD ? US Dollar</option></select></div><button class="button" type="submit">Review cash-out</button>
    </form></section></main></div></div><script src="/portal.js"></script>
</body></html>

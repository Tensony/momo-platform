name: ci-cd

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # scan the whole history, not just the tip
      - name: install gitleaks & scan
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --config .gitleaks.toml --verbose --redact

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: momo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/momo_test
      PYTHONPATH: src
      DB_POOL_MAX: "40"
      DB_POOL_TIMEOUT: "60"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests scripts
      - name: verify postgresql connection
        run: |
          python -c "
          import os, psycopg, time
          url = os.environ['TEST_DATABASE_URL']
          print(f'Testing connection to {url}...')
          for i in range(15):
              try:
                  conn = psycopg.connect(url, autocommit=True)
                  print('PostgreSQL is ready and reachable!')
                  conn.close()
                  break
              except Exception as e:
                  print(f'Retry {i+1}: {e}')
                  time.sleep(2)
          else:
              raise SystemExit('Could not connect to PostgreSQL container')
          "
      - name: unit + integration tests, coverage gate (>= 60%, fails below)
        run: |
          set -o pipefail
          pytest -v --cov=src/momo --cov-report=xml --cov-report=term-missing 2>&1 | tee pytest.log
      - name: show test log in step summary
        if: always()
        run: |
          if [ -f pytest.log ]; then
            echo "## Pytest Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 250 pytest.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
      - name: correctness proofs (idempotency x100, saga fault injection, 50 concurrent transfers)
        run: python scripts/proofs/run_proofs.py --local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence
          path: |
            evidence-out/
            coverage.xml
            pytest.log

  terraform-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: Build Lambda packages
        run: |
          chmod +x scripts/build_lambdas.sh
          bash scripts/build_lambdas.sh
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate
      - name: IaC security scan (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.3
        with: { working_directory: infra/terraform, soft_fail: false }

  deploy:
    # Runs ONLY when every gate above is green: tests, secret scan, coverage, proofs, terraform validate.
    needs: [secret-scan, test, terraform-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: { group: deploy, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: momo-dev-wallet-api
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Deploy new revision to ECS Fargate
        run: |
          aws ecs update-service --cluster momo-dev-cluster --service momo-dev-wallet-api --force-new-deployment
          aws ecs wait services-stable --cluster momo-dev-cluster --services momo-dev-wallet-api

      - name: Smoke test
        run: |
          curl -ksf "https://momo-dev-alb-5850337.us-east-1.elb.amazonaws.com/health" || { echo "Smoke test failed!"; exit 1; }
          curl -ksf "https://momo-dev-alb-5850337.us-east-1.elb.amazonaws.com/" >/dev/null || { echo "Root UI smoke test failed!"; exit 1; }

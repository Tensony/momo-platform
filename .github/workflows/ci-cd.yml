name: ci-cd

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write # OIDC to AWS: no long-lived AWS keys are stored in GitHub

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'af-south-1' }}

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # scan the whole history, not just the tip
      - name: install gitleaks & scan
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --config .gitleaks.toml --verbose --redact

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: momo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/momo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests scripts
      - name: unit + integration tests, coverage gate (>= 60%, fails below)
        run: pytest -v --cov --cov-report=xml --cov-report=term-missing
      - name: correctness proofs (idempotency x100, saga fault injection, 50 concurrent transfers)
        run: python scripts/proofs/run_proofs.py --local
      - uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: |
            evidence-out/
            coverage.xml

  terraform-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: Build Lambda packages
        run: |
          chmod +x scripts/build_lambdas.sh
          bash scripts/build_lambdas.sh
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate
      - name: IaC security scan (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.3
        with: { working_directory: infra/terraform, soft_fail: true }

  deploy:
    # Runs ONLY when every gate above is green: tests, secret scan, coverage, proofs, terraform validate.
    needs: [secret-scan, test, terraform-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production
    concurrency: { group: deploy, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build Lambda artifacts and apply infrastructure (new image tag = git SHA)
        run: |
          scripts/build_lambdas.sh
          terraform -chdir=infra/terraform init -input=false
          terraform -chdir=infra/terraform apply -input=false -auto-approve \
            -var "alert_email=${{ vars.ALERT_EMAIL }}" -var "region=$AWS_REGION" \
            -var "api_image_tag=${{ github.sha }}" -target=aws_ecr_repository.api
      - name: Build and push the API image
        id: image
        run: |
          REPO=$(terraform -chdir=infra/terraform output -raw ecr_repository_url)
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REPO%%/*}"
          docker build -t "$REPO:${{ github.sha }}" .
          docker push "$REPO:${{ github.sha }}"
      - name: Apply remaining infrastructure (Lambdas, Step Functions, task definition)
        run: |
          terraform -chdir=infra/terraform apply -input=false -auto-approve \
            -var "alert_email=${{ vars.ALERT_EMAIL }}" -var "region=$AWS_REGION" \
            -var "api_image_tag=${{ github.sha }}"
      - name: Blue/green deploy via CodeDeploy (auto-rollback on failure or alarm)
        run: |
          T="terraform -chdir=infra/terraform output -raw"
          TD=$(aws ecs describe-task-definition --task-definition "$($T ecs_task_family)" --query taskDefinition.taskDefinitionArn --output text)
          SPEC=$(python3 -c "import json;print(json.dumps({'version':'0.0','Resources':[{'TargetService':{'Type':'AWS::ECS::Service','Properties':{'TaskDefinition':'$TD','LoadBalancerInfo':{'ContainerName':'api','ContainerPort':8080}}}}]}))")
          DEP=$(aws deploy create-deployment --application-name "$($T codedeploy_app)" \
                 --deployment-group-name "$($T codedeploy_deployment_group)" \
                 --revision "{\"revisionType\":\"AppSpecContent\",\"appSpecContent\":{\"content\":$(python3 -c 'import json,sys;print(json.dumps(sys.argv[1]))' "$SPEC")}}" \
                 --query deploymentId --output text)
          aws deploy wait deployment-successful --deployment-id "$DEP" \
            || { aws deploy get-deployment --deployment-id "$DEP"; echo "Deployment failed -> CodeDeploy rolled back automatically"; exit 1; }
      - name: Smoke test
        run: |
          URL=$(terraform -chdir=infra/terraform output -raw api_url)
          curl -ksf "$URL/health"

name: ci-cd

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks and scan
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --config .gitleaks.toml --verbose --redact

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: momo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/momo_test
      PYTHONPATH: src
      DB_POOL_MAX: "40"
      DB_POOL_TIMEOUT: "60"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python environment and install dependencies
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt
      - name: Run linter
        run: ruff check src tests scripts
      - name: Verify PostgreSQL connection
        run: |
          python -c "
          import os, psycopg, time
          url = os.environ['TEST_DATABASE_URL']
          print(f'Testing connection to {url}...')
          for i in range(15):
              try:
                  conn = psycopg.connect(url, autocommit=True)
                  print('PostgreSQL is ready and reachable!')
                  conn.close()
                  break
              except Exception as e:
                  print(f'Retry {i+1}: {e}')
                  time.sleep(2)
          else:
              raise SystemExit('Could not connect to PostgreSQL container')
          "
      - name: Run unit and integration tests with coverage gate
        run: |
          set -o pipefail
          pytest -v --cov=src/momo --cov-report=xml --cov-report=term-missing 2>&1 | tee pytest.log
      - name: Show test log in step summary
        if: always()
        run: |
          if [ -f pytest.log ]; then
            echo "## Pytest Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 250 pytest.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
      - name: Run correctness proofs
        run: python scripts/proofs/run_proofs.py --local

  terraform-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build Lambda packages
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          chmod +x scripts/build_lambdas.sh
          bash scripts/build_lambdas.sh
      - name: Check and validate Terraform
        run: |
          if ! command -v terraform >/dev/null 2>&1; then
            curl -fsSL https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip -o /tmp/tf.zip
            sudo unzip -o /tmp/tf.zip -d /usr/local/bin
          fi
          terraform -chdir=infra/terraform fmt -check -recursive
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate
      - name: IaC security scan (tfsec)
        run: |
          curl -sSL https://github.com/aquasecurity/tfsec/releases/download/v1.28.11/tfsec-linux-amd64 -o /tmp/tfsec
          chmod +x /tmp/tfsec
          /tmp/tfsec infra/terraform --soft-fail

  deploy:
    needs:
      - secret-scan
      - test
      - terraform-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build, push to ECR, and deploy to ECS Fargate
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets[format('{0}', 'AWS_ACCESS_KEY_ID')] }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets[format('{0}', 'AWS_SECRET_ACCESS_KEY')] }}
          ECR_REPOSITORY: momo-dev-wallet-api
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" -t "$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"
          aws ecs update-service --cluster momo-dev-cluster --service momo-dev-wallet-api --force-new-deployment
          aws ecs wait services-stable --cluster momo-dev-cluster --services momo-dev-wallet-api

      - name: Smoke test
        run: |
          curl -ksf "https://momo-dev-alb-5850337.us-east-1.elb.amazonaws.com/health" || { echo "Smoke test failed!"; exit 1; }
          curl -ksf "https://momo-dev-alb-5850337.us-east-1.elb.amazonaws.com/" >/dev/null || { echo "Root UI smoke test failed!"; exit 1; }

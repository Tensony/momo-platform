name: ci-cd

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # scan the whole history, not just the tip
      - name: install gitleaks & scan
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --config .gitleaks.toml --verbose --redact

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: momo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/momo_test
      PYTHONPATH: src
      DB_POOL_MAX: "40"
      DB_POOL_TIMEOUT: "60"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests scripts
      - name: verify postgresql connection
        run: |
          python -c "
          import os, psycopg, time
          url = os.environ['TEST_DATABASE_URL']
          print(f'Testing connection to {url}...')
          for i in range(15):
              try:
                  conn = psycopg.connect(url, autocommit=True)
                  print('PostgreSQL is ready and reachable!')
                  conn.close()
                  break
              except Exception as e:
                  print(f'Retry {i+1}: {e}')
                  time.sleep(2)
          else:
              raise SystemExit('Could not connect to PostgreSQL container')
          "
      - name: unit + integration tests, coverage gate (>= 60%, fails below)
        run: |
          set -o pipefail
          pytest -v --cov=src/momo --cov-report=xml --cov-report=term-missing 2>&1 | tee pytest.log
      - name: show test log in step summary
        if: always()
        run: |
          if [ -f pytest.log ]; then
            echo "## Pytest Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 250 pytest.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
      - name: correctness proofs (idempotency x100, saga fault injection, 50 concurrent transfers)
        run: python scripts/proofs/run_proofs.py --local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence
          path: |
            evidence-out/
            coverage.xml
            pytest.log

  terraform-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: Build Lambda packages
        run: |
          chmod +x scripts/build_lambdas.sh
          bash scripts/build_lambdas.sh
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate
      - name: IaC security scan (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.3
        with: { working_directory: infra/terraform, soft_fail: false }

  deploy:
    # Deployment is opt-in and gated by the protected GitHub environment.
    needs: [secret-scan, test, terraform-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: aws-deploy
    permissions:
      contents: read
      id-token: write
    concurrency: { group: deploy, cancel-in-progress: false }
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_PROJECT: ${{ vars.AWS_PROJECT }}
      AWS_ENVIRONMENT: ${{ vars.AWS_ENVIRONMENT }}
      ALLOW_SELF_SIGNED_SMOKE_TEST: ${{ vars.ALLOW_SELF_SIGNED_SMOKE_TEST }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: |
          test -n "$AWS_REGION" || { echo "Set the selected Region in the AWS_REGION repository variable"; exit 1; }
          test -n "$AWS_DEPLOY_ROLE_ARN" || { echo "Set the AWS_DEPLOY_ROLE_ARN repository secret"; exit 1; }
          test -n "$ALERT_EMAIL" || { echo "Set the ALERT_EMAIL repository variable"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          PROJECT="${AWS_PROJECT:-momo}"
          ENVIRONMENT="${AWS_ENVIRONMENT:-dev}"
          ECR_REPOSITORY="$PROJECT-$ENVIRONMENT-wallet-api"
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Register immutable image and deploy to ECS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          PROJECT="${AWS_PROJECT:-momo}"
          ENVIRONMENT="${AWS_ENVIRONMENT:-dev}"
          CLUSTER="$PROJECT-$ENVIRONMENT-cluster"
          SERVICE="$PROJECT-$ENVIRONMENT-wallet-api"
          ECR_REPOSITORY="$SERVICE"
          IMAGE_DIGEST="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=${GITHUB_SHA}" --query 'imageDetails[0].imageDigest' --output text)"
          test -n "$IMAGE_DIGEST" && test "$IMAGE_DIGEST" != "None" || { echo "Could not resolve image digest for $GITHUB_SHA"; exit 1; }
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY@$IMAGE_DIGEST"
          aws ecs describe-task-definition --task-definition "$SERVICE" --query taskDefinition --output json > task-definition.json
          jq --arg image "$IMAGE" '
            if ([.containerDefinitions[] | select(.name == "api")] | length) != 1 then
              error("Expected exactly one api container in the task definition")
            else
              .containerDefinitions |= map(if .name == "api" then .image = $image else . end)
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
            end
          ' task-definition.json > task-definition-new.json
          TASK_DEFINITION_ARN="$(aws ecs register-task-definition --cli-input-json file://task-definition-new.json --query 'taskDefinition.taskDefinitionArn' --output text)"
          CONTROLLER="$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].deploymentController.type' --output text)"
          if [ "$CONTROLLER" = "CODE_DEPLOY" ]; then
            APP_SPEC="$(jq -nc --arg task "$TASK_DEFINITION_ARN" '{version:"0.0",Resources:[{TargetService:{Type:"AWS::ECS::Service",Properties:{TaskDefinition:$task,LoadBalancerInfo:{ContainerName:"api",ContainerPort:8080}}}}]}')"
            jq -n --arg content "$APP_SPEC" '{revisionType:"AppSpecContent",appSpecContent:{content:$content}}' > deployment-revision.json
            DEPLOYMENT_ID="$(aws deploy create-deployment \
              --application-name "$PROJECT-$ENVIRONMENT-api" \
              --deployment-group-name "$PROJECT-$ENVIRONMENT-api" \
              --revision file://deployment-revision.json \
              --query deploymentId --output text)"
            aws deploy wait deployment-successful --deployment-id "$DEPLOYMENT_ID"
          else
            aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$TASK_DEFINITION_ARN"
          fi
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

      - name: Smoke test
        run: |
          PROJECT="${AWS_PROJECT:-momo}"
          ENVIRONMENT="${AWS_ENVIRONMENT:-dev}"
          ALB_NAME="$PROJECT-$ENVIRONMENT-alb"
          ALB_DNS="$(aws elbv2 describe-load-balancers --names "$ALB_NAME" --query 'LoadBalancers[0].DNSName' --output text)"
          test -n "$ALB_DNS" && test "$ALB_DNS" != "None" || { echo "Could not resolve ALB $ALB_NAME"; exit 1; }
          CURL_TLS_ARGS=()
          if [ "$ALLOW_SELF_SIGNED_SMOKE_TEST" = "true" ]; then
            CURL_TLS_ARGS+=(--insecure)
          fi
          curl "${CURL_TLS_ARGS[@]}" --fail --silent --show-error "https://$ALB_DNS/health"
